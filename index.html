<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOOOOST x1000</title>
<meta name="description" content="Leave me running and just do your thing.">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="app.js">
<link rel="modulepreload" href="banana.js">
<link rel="modulepreload" href="vendor/three.js">
<link rel="modulepreload" href="stars.js">
<link rel="modulepreload" href="confetti.js">
<link rel="preload" href="banana/banana-bunch.glb" as="fetch" crossorigin>
</head>
<body>

<div class="bg" id="bg" aria-hidden="true"></div>

<canvas class="stars" id="stars" aria-hidden="true"></canvas>

<main class="app" id="app">

  <h1 class="title" id="title">BOOOOST x1000</h1>

  <div class="banana-wrap">
    <canvas class="banana" id="banana" aria-hidden="true"></canvas>
    <span class="combo" id="combo" aria-hidden="true"></span>
  </div>

  <button class="activate" id="activate" type="button"><span class="speaker" id="speaker" hidden>&#128266;</span><span id="activate-label">activate</span></button>

  <p class="hint" id="hint">leave me running and just do your thing my guy! feel your productivity go up instantly!</p>

</main>

<div class="party" id="party" aria-hidden="true"></div>

<div class="strobe" id="strobe" aria-hidden="true"></div>

<div class="burst" id="burst" aria-hidden="true"></div>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<div class="flash" id="flash" aria-hidden="true"><span id="flash-text"></span></div>

<script type="module" src="app.js"></script>
</body>
</html>
